name: Build Deluge.app

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-macos-app:
    name: Build Deluge.app for Apple Silicon
    runs-on: macos-14  # Apple Silicon runner (M1)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Install dependencies
        run: |
          # Tap the local formula
          brew tap-new vinayakkulkarni/deluge-meta || true
          rm -rf $(brew --repository)/Library/Taps/vinayakkulkarni/homebrew-deluge-meta
          ln -s $GITHUB_WORKSPACE $(brew --repository)/Library/Taps/vinayakkulkarni/homebrew-deluge-meta

          # Install the formula
          brew install --build-from-source vinayakkulkarni/deluge-meta/deluge-meta

      - name: Create Deluge.app wrapper
        run: |
          # Create a proper .app wrapper that launches deluge-gtk
          # This approach works better than py2app for GTK apps on macOS

          APP_DIR="$GITHUB_WORKSPACE/dist/Deluge.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"

          # Create the launcher script
          cat > "$APP_DIR/Contents/MacOS/Deluge" << 'LAUNCHER'
          #!/bin/bash
          # Deluge.app launcher
          # This wrapper script launches deluge-gtk from Homebrew installation

          # Ensure Homebrew paths are available
          if [[ -d "/opt/homebrew/bin" ]]; then
              export PATH="/opt/homebrew/bin:$PATH"
          elif [[ -d "/usr/local/bin" ]]; then
              export PATH="/usr/local/bin:$PATH"
          fi

          # Set GTK backend for macOS
          export GDK_BACKEND=quartz

          # Suppress Python deprecation warnings
          export PYTHONWARNINGS="ignore::UserWarning"

          # Check if deluge-gtk is available via Homebrew
          DELUGE_GTK="/opt/homebrew/opt/deluge-meta/bin/deluge-gtk"
          if [[ ! -x "$DELUGE_GTK" ]]; then
              DELUGE_GTK="/usr/local/opt/deluge-meta/bin/deluge-gtk"
          fi

          if [[ ! -x "$DELUGE_GTK" ]]; then
              osascript -e 'display alert "Deluge Not Found" message "Please install Deluge via Homebrew:\n\nbrew tap vinayakkulkarni/deluge-meta\nbrew install deluge-meta" as critical'
              exit 1
          fi

          # Run deluge-gtk
          exec "$DELUGE_GTK" "$@"
          LAUNCHER
          chmod +x "$APP_DIR/Contents/MacOS/Deluge"

          # Create Info.plist
          cat > "$APP_DIR/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Deluge</string>
              <key>CFBundleDisplayName</key>
              <string>Deluge</string>
              <key>CFBundleIdentifier</key>
              <string>org.deluge-torrent.deluge</string>
              <key>CFBundleVersion</key>
              <string>2.2.0</string>
              <key>CFBundleShortVersionString</key>
              <string>2.2.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleExecutable</key>
              <string>Deluge</string>
              <key>CFBundleIconFile</key>
              <string>Deluge</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSRequiresAquaSystemAppearance</key>
              <false/>
              <key>LSApplicationCategoryType</key>
              <string>public.app-category.utilities</string>
              <key>CFBundleDocumentTypes</key>
              <array>
                  <dict>
                      <key>CFBundleTypeName</key>
                      <string>BitTorrent File</string>
                      <key>CFBundleTypeExtensions</key>
                      <array>
                          <string>torrent</string>
                      </array>
                      <key>CFBundleTypeRole</key>
                      <string>Viewer</string>
                      <key>LSHandlerRank</key>
                      <string>Default</string>
                  </dict>
              </array>
              <key>CFBundleURLTypes</key>
              <array>
                  <dict>
                      <key>CFBundleURLName</key>
                      <string>Magnet URL</string>
                      <key>CFBundleURLSchemes</key>
                      <array>
                          <string>magnet</string>
                      </array>
                  </dict>
              </array>
          </dict>
          </plist>
          PLIST

          # Try to get an icon from the installed deluge package
          DELUGE_ICON="/opt/homebrew/opt/deluge-meta/libexec/lib/python3.14/site-packages/deluge/ui/data/icons/hicolor/scalable/apps/deluge.svg"
          if [[ -f "$DELUGE_ICON" ]]; then
              # Convert SVG to ICNS if we have the tools
              if command -v rsvg-convert &>/dev/null && command -v iconutil &>/dev/null; then
                  mkdir -p /tmp/deluge-icons.iconset
                  for size in 16 32 64 128 256 512; do
                      rsvg-convert -w $size -h $size "$DELUGE_ICON" -o "/tmp/deluge-icons.iconset/icon_${size}x${size}.png"
                      rsvg-convert -w $((size*2)) -h $((size*2)) "$DELUGE_ICON" -o "/tmp/deluge-icons.iconset/icon_${size}x${size}@2x.png"
                  done
                  iconutil -c icns -o "$APP_DIR/Contents/Resources/Deluge.icns" /tmp/deluge-icons.iconset || true
              fi
          fi

          echo "Deluge.app created at $APP_DIR"
          ls -la "$APP_DIR/Contents/"
          ls -la "$APP_DIR/Contents/MacOS/"

      - name: Create DMG
        run: |
          # Create a DMG from the .app
          mkdir -p /tmp/dmg-contents
          cp -R "$GITHUB_WORKSPACE/dist/Deluge.app" /tmp/dmg-contents/

          # Create a symlink to /Applications for easy drag-drop
          ln -s /Applications /tmp/dmg-contents/Applications

          # Create the DMG
          hdiutil create -volname "Deluge" \
            -srcfolder /tmp/dmg-contents \
            -ov -format UDZO \
            "$GITHUB_WORKSPACE/Deluge-2.2.0-arm64.dmg"

          echo "DMG created:"
          ls -la "$GITHUB_WORKSPACE/Deluge-2.2.0-arm64.dmg"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deluge-app-arm64
          path: dist/Deluge.app
          if-no-files-found: warn

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deluge-dmg-arm64
          path: Deluge-2.2.0-arm64.dmg
          if-no-files-found: warn

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Deluge-2.2.0-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
